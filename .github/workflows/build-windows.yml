name: Build Windows installer
run-name: Windows installer · ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag whose version matches package.json
        type: string
        required: true
        default: v0.3.1
      upload_to_release:
        description: Attach installer to the existing draft release (never publishes it)
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Validate requested tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v0.2.6.'
          }

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify release version
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG -or $tauriVersion -ne $version -or $cargoVersion -ne $version) {
            throw 'Tag, package.json, Cargo.toml and tauri.conf.json versions must match.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Rust stable for Windows x64
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Require updater signing key
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the repository secret TAURI_SIGNING_PRIVATE_KEY before building desktop releases.'
          }

      - name: Build native Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --ci

      - name: Verify and stage installer
        id: stage
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installers = @(Get-ChildItem -Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          New-Item -ItemType Directory -Path release/windows -Force | Out-Null
          $filename = "Mk.1-Lite_$($env:APP_VERSION)_windows-x64-setup.exe"
          $destination = Join-Path 'release/windows' $filename
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          node scripts/verify-windows-installer.mjs 'src-tauri/target/x86_64-pc-windows-msvc/release/mark1light.exe' $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Encoding utf8NoBOM 'release/windows/windows-SHA256SUMS.txt'
          "filename=$filename" >> $env:GITHUB_OUTPUT
          "### Windows x64 installer" >> $env:GITHUB_STEP_SUMMARY
          "- File: $filename" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          '- Build verified as AMD64; interactive installation still requires Windows testing.' >> $env:GITHUB_STEP_SUMMARY

      - name: Stage signed updater artifacts
        run: node scripts/stage-updater-artifact.mjs windows-x86_64

      - name: Preserve build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Mk.1-Lite-${{ steps.version.outputs.version }}-windows-x64
          path: |
            release/updater/windows-x86_64/*
            release/windows/windows-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach files to existing draft release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0) { throw 'Create the draft release before attaching files.' }
          if ($draft.Trim() -ne 'true') { throw 'Refusing to modify a published release. Use an existing draft release.' }
          $files = @(Get-ChildItem release/updater/windows-x86_64 -File | ForEach-Object { $_.FullName })
          $files += (Resolve-Path release/windows/windows-SHA256SUMS.txt).Path
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
