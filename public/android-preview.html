<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mk.1 Lite · 安卓界面预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#e3e9e3;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.layout{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-around;gap:70px;padding:48px 32px}.info{max-width:380px}.tag{font-size:11px;letter-spacing:3px;color:#8bcf95}.info h1{font-size:46px;letter-spacing:-2px;line-height:1.2;margin:22px 0}.info h1 span{color:#7ad68b;font-weight:400}.info p{font-size:15px;color:#9daa9f;line-height:1.9}.controls{display:flex;gap:8px;margin:28px 0;flex-wrap:wrap}button{cursor:pointer;background:#1f2a22;color:#d1dfd3;border:1px solid #36483a;border-radius:9px;padding:10px 14px}button.active{color:#112416;background:#8cdb9b;border-color:#8cdb9b}.note{font-size:12px!important;color:#75877a!important}.device{flex-shrink:0;width:414px;border:8px solid #303632;border-radius:42px;background:#202221;overflow:hidden;box-shadow:0 30px 100px #0009}.status{height:31px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:11px;color:#ced6cf}.status span:last-child{font-size:10px;letter-spacing:2px}iframe{display:block;width:100%;height:796px;border:0}.gesture{height:22px;display:flex;justify-content:center;align-items:center}.gesture:after{content:'';width:110px;height:4px;border-radius:9px;background:#bac4bc}@media(max-width:850px){.layout{flex-direction:column;gap:28px;padding:28px 16px}.info{max-width:414px}.info h1{font-size:32px;margin:12px 0}.info p{margin:10px 0}.controls{margin:16px 0}.device{width:min(414px,100%)}iframe{height:740px}}
</style></head><body><main class="layout"><section class="info"><div class="tag">MK.1 LITE / ANDROID</div><h1>随时记录。<br><span>轻松阅读。</span></h1><p>为手机重新整理的 Markdown 工作空间。<br>底部操作触手可及，编辑与预览一键切换。</p><div class="controls"><button data-size="398" class="active">标准手机</button><button data-size="344">小屏手机</button></div><p class="note">右侧为可操作的真实界面，可编辑、切换预览、打开文件和查看设置。示例草稿与桌面工作区隔离。</p><p class="note">这是浏览器布局预览。系统文件选择器、软键盘和安装包仍需安卓设备验证。</p></section><div class="device"><div class="status"><span>9:41</span><span>▴ ▰ 100%</span></div><iframe title="安卓应用界面" src="./?android-preview=1"></iframe><div class="gesture"></div></div></main><script>document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{document.querySelector('.device').style.width=Number(button.dataset.size)+16+'px';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button))})</script></body></html>
